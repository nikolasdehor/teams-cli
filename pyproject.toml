[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "teams-cli"
version = "0.1.0"
description = "CLI para operar o Microsoft Teams via Graph (chats, canais, reunioes)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["msal>=1.30", "requests>=2.31"]

[project.scripts]
teams = "teams_cli.cli:main"

[tool.setuptools.packages.find]
include = ["teams_cli*"]
